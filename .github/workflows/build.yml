# Bauen und testen; bei einem Tag v<Version> den fertigen Plugin-Ordner als Release-Zip anhängen
# (für die Plugin-Bibliothek von Brim, siehe catalog/ im Brim-Repository).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brim-gamemode

      # Das Plugin baut gegen Brim.Sdk aus dem Brim-Repository, das daneben liegt.
      - uses: actions/checkout@v4
        with:
          repository: wheatley2056/brim
          ref: main
          path: brim

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        working-directory: brim-gamemode
        run: dotnet test tests/GameMode.Tests -c Release

      - name: Plugin-Ordner bauen
        working-directory: brim-gamemode
        run: dotnet publish src/GameMode -c Release -r win-x64 --self-contained false -o artifacts/gamemode

      # Tag und Version im plugin.json müssen gleich sein, sonst lehnt die Bibliothek das Zip ab.
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: brim-gamemode
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/gamemode/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "plugin.json hat Version $version, der Tag ist ${{ github.ref_name }}" }

      - name: Zip
        working-directory: brim-gamemode
        shell: pwsh
        run: Compress-Archive -Path artifacts/gamemode/* -DestinationPath artifacts/brim-gamemode.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: brim-gamemode
          path: brim-gamemode/artifacts/brim-gamemode.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: brim-gamemode
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/brim-gamemode.zip --title "GameMode-Plugin ${{ github.ref_name }}" --generate-notes
